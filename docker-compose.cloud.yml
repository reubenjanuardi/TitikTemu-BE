# Docker Compose for Cloud PostgreSQL (No Local Database)
# Use this when your PostgreSQL is hosted on Supabase, AWS RDS, Azure, etc.

services:
  # Auth Service - connects to cloud database
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: titiktemu_auth_service
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      # Use cloud database URL from environment
      DATABASE_URL: ${AUTH_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}
      TZ: "UTC"
    ports:
      - "3001:3001"
    networks:
      - titiktemu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Event Service - connects to cloud database
  event-service:
    build:
      context: ./services/event-service
      dockerfile: Dockerfile
    container_name: titiktemu_event_service
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3002
      DATABASE_URL: ${EVENT_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}
      TZ: "UTC"
    ports:
      - "3002:3002"
    networks:
      - titiktemu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Attendance Service - connects to cloud database
  attendance-service:
    build:
      context: ./services/attendance-service
      dockerfile: Dockerfile
    container_name: titiktemu_attendance_service
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3003
      DATABASE_URL: ${ATTENDANCE_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}
      TZ: "UTC"
    ports:
      - "3003:3003"
    networks:
      - titiktemu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3003/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Venue Consumer Service (no database needed)
  venue-consumer-service:
    build:
      context: ./services/venue-consumer-service
      dockerfile: Dockerfile
    container_name: titiktemu_venue_service
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3004
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}
      LOGE_GRAPHQL_URL: ${LOGE_GRAPHQL_URL:-http://localhost:4000/graphql}
      TZ: "UTC"
    ports:
      - "3004:3004"
    networks:
      - titiktemu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3004/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API Gateway
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: titiktemu_gateway
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-min-32-chars}
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-service:3001}
      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL:-http://event-service:3002}
      ATTENDANCE_SERVICE_URL: ${ATTENDANCE_SERVICE_URL:-http://attendance-service:3003}
      VENUE_SERVICE_URL: ${VENUE_SERVICE_URL:-http://venue-consumer-service:3004}
      TZ: "UTC"
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - event-service
      - attendance-service
      - venue-consumer-service
    networks:
      - titiktemu-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  titiktemu-network:
    driver: bridge
# NOTE: No PostgreSQL container - using cloud database instead!
